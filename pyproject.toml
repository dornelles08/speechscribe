[project]
name = "speechscribe"
version = "1.0.0"
description = "Gravação e transcrição de voz ao vivo com Whisper (desktop multiplataforma)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "dornelles" }
]
dependencies = [
    "faster-whisper>=1.2.1",
    "numpy>=2.0.2",
    "pyinstaller>=6.22.3",
    "pyside6>=6.10.3",
    "requests>=2.32.5",
    "setuptools>=82.0.1",
    "sounddevice>=0.5.6",
    "webrtcvad>=2.0.10",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["speechscribe*"]
