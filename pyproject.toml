[project]
name = "speechscribe"
version = "1.0.0"
description = "Gravação e transcrição de voz ao vivo com Whisper (desktop multiplataforma)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "dornelles" }
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["speechscribe*"]
