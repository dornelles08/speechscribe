name: Build & Release SpeechScribe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3

      - name: Sincronizar dependências
        run: uv sync

      - name: Instalar dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1 ffmpeg

      - name: Instalar dependências do sistema (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg

      - name: Build executável (PyInstaller)
        run: uv run pyinstaller build/speechscribe.spec --noconfirm --clean

      - name: Listar artefatos
        run: ls -la dist/ || true

      - name: Upload artefato Linux
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: speechscribe-linux
          path: |
            dist/speechscribe
            dist/speechscribe/speechscribe

      - name: Upload artefato macOS .app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: speechscribe-macos-app
          path: dist/SpeechScribe.app

      - name: Upload artefato macOS .dmg
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: speechscribe-macos-dmg
          path: dist/*.dmg

      - name: Upload artefato Windows .exe
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: speechscribe-windows
          path: |
            dist/speechscribe.exe
            dist/speechscribe/speechscribe.exe

  release:
    name: Criar Release no GitHub
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Baixar artefatos Linux
        uses: actions/download-artifact@v4
        with:
          name: speechscribe-linux
          path: release/linux

      - name: Baixar artefatos macOS app
        uses: actions/download-artifact@v4
        with:
          name: speechscribe-macos-app
          path: release/macos-app

      - name: Baixar artefatos macOS dmg
        uses: actions/download-artifact@v4
        with:
          name: speechscribe-macos-dmg
          path: release/macos-dmg

      - name: Baixar artefatos Windows
        uses: actions/download-artifact@v4
        with:
          name: speechscribe-windows
          path: release/windows

      - name: Listar tudo para release
        run: ls -la release/ release/*/

      - name: Criar release no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ github.run_number }}"
          gh release create "$TAG" --title "SpeechScribe $TAG" --notes "Build automático a partir do push na main." --latest \
            release/linux/speechscribe \
            release/macos-app/SpeechScribe.app \
            release/macos-dmg/*.dmg \
            release/windows/speechscribe.exe 2>/dev/null || true
